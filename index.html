<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameScope</title><link rel="stylesheet" href="styles.css"></head><body>
<header><b>Game<span>Scope</span></b><div class="search"><input id="q" placeholder="Search games..."><button id="go">Search</button></div><div id="acct"><button id="login">Log in</button><button id="register" class="accent">Create account</button></div></header>
<section class="hero"><div><small>GAME PRICE EXPLORER</small><h1>Browse games. Compare prices. Find sales.</h1><p>Search across supported game stores and see country-specific pricing in one place.</p></div><div class="stat"><strong id="count">Loading…</strong><span>Steam games indexed</span></div></section>
<section class="controls"><div id="platforms"><button class="active" data-p="all">All</button><button data-p="Steam">Steam</button><button data-p="Xbox">Xbox</button><button data-p="Nintendo">Nintendo</button><button data-p="PlayStation">PlayStation</button><button data-p="Meta Quest">Meta Quest</button></div><div class="filters"><label>Country <select id="country"><option>US</option><option>CA</option><option>GB</option><option>AU</option><option>DE</option><option>FR</option><option>JP</option><option>BR</option></select></label><label><input type="checkbox" id="sale"> On sale</label><label>Sort <select id="sort"><option value="featured">A–Z</option><option value="price-low">Price low → high</option><option value="price-high">Price high → low</option><option value="discount">Biggest discount</option></select></label></div></section>
<main><div class="head"><h2 id="heading">Games</h2><span id="info"></span></div><div id="grid" class="grid"></div></main>
<section class="reviews"><div class="head"><h2>GameScope reviews</h2><button id="review" class="accent">Write a review</button></div><div id="reviews"></div></section>
<div id="modal" class="modal" hidden><div class="modalbox"><button id="close">×</button><div id="modalbody"></div></div></div><script src="app.js"></script></body></html>
